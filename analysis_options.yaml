include: package:flutter_lints/flutter.yaml

# The repo is formatted at 120 columns; declare it so `dart format` uses that
# width instead of the 80-col default (which would rewrap ~140 lines).
# NOTE: the sources are still short-style (pre-Dart-3.7). Dart 3.7+ formats in
# tall style, so a modern `dart format .` will restructure ~15 files even with
# this set. CI pins an older Flutter, so it stays green; a full tall-style
# reformat (+ a CI Dart bump) is the only way to make the two agree.
formatter:
  page_width: 120

analyzer:
  errors:
    argument_type_not_assignable: error
    invalid_assignment: error
    dead_code: warning
    overridden_fields: ignore
    use_key_in_widget_constructors: ignore

linter:
  rules:
    public_member_api_docs: false
    avoid_print: true
    avoid_empty_else: true
    annotate_overrides: true
    cancel_subscriptions: true
    close_sinks: true
    avoid_positional_boolean_parameters: false
    use_super_parameters: true
    prefer_relative_imports: true