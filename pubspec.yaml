name: showcase_tutorial
description: A Flutter package to Showcase/Highlight widgets step by step.
version: 2.0.0
homepage: https://github.com/abdelrahman-abied/showcase_tutorial
issue_tracker: https://github.com/abdelrahman-abied/showcase_tutorial/issues

topics:
  - showcase
  - tutorial
  - onboarding
  - overlay
  - walkthrough

screenshots:
  - description: "One tour through a travel app: exact-shape and multi-widget highlights, auto-scroll, a step on the next screen, then dark mode and Arabic. Every colour comes from the app's theme."
    path: preview/tour.gif

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


# This package supports all platforms listed below.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:


